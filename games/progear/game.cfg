# Progear (Cave / Capcom 2001, CPS-2 arcade board): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Progear
# What the window is called (the name stays the folder the player's settings are kept under)
title = Progear Recomp
id = progear
app_id = io.github.omegakatana92.progear
disclaimer = Not affiliated with Capcom.
# Progear is a horizontal shooter by Cave, published by Capcom for the CP System II.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `progear` is the parent set (Europe 010117) and has no parent of its own.
rom_set = progear
rom_parent = progear
rom_name = Progear (Europe 010117)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words).
# graphics: this board's graphics ROMs are wired as EIGHT byte lanes (the SIMM modules), so the list
#   begins with "byte ": eight files side by side make 64-bit words, one byte from each, in board order
#   (lanes 0..7 = pga-simm.01c, 01d, 01a, 01b, 03c, 03d, 03a, 03b). Every other CPS-2 port here uses the
#   four-file (16-bit lane) form; see cps2recomp/PATCH.md.
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = pgae.03:8577bc86 pgae.04:d850da04
graphics = byte pga-simm.01c:452f98b0 pga-simm.01d:9e672092 pga-simm.01a:ae9ddafe pga-simm.01b:94d72d94 pga-simm.03c:48a1886d pga-simm.03d:172d7e37 pga-simm.03a:9ee33d98 pga-simm.03b:848dee32
sound_program = pga.01:bdbfa992
samples = pga-simm.05a:c0aac80c pga-simm.05b:37a65d86 pga-simm.06a:d3f1e934 pga-simm.06b:8b39489a
key = progear.key:eee6b2a8

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region holds 1 MiB (two 512 KiB ROMs: pgae.03/04), so this spans the whole program.
code_end = 100000
